services:
  - type: web
    name: pitchside-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: REFRESH_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      # Hostinger FTP — server-side CDN publish (publish.py). Set to the same
      # values as the static-publish GitHub secrets.
      - key: HOSTINGER_FTP_HOST
        sync: false
      - key: HOSTINGER_FTP_USER
        sync: false
      - key: HOSTINGER_FTP_PASSWORD
        sync: false
      - key: HOSTINGER_DATA_DIR
        sync: false
