name: nightly-archive

on:
  schedule:
    - cron: "0 7 * * *"   # after the morning consolidation
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download archive from the API
        run: |
          curl --silent --show-error --fail \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            "${{ secrets.API_URL }}/api/internal/archive?key=${{ secrets.REFRESH_KEY }}" \
            -o backend/app/data/results_archive.json
          python3 -m json.tool backend/app/data/results_archive.json > /dev/null

      - name: Commit if changed
        run: |
          git config user.name "pitchside-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/data/results_archive.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Archive results $(date -u +%F)"
          git push
