name: refresh

on:
  # Manual / break-glass only. Refresh now runs via the external cron that hits
  # /api/internal/refresh?...&publish=1 (refresh then publish, and keeps Render
  # warm). GitHub's schedule: was throttled to ~1.5-2.5h, leaving data stale.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping refresh endpoint
        run: |
          curl --silent --show-error --fail \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            "${{ secrets.API_URL }}/api/internal/refresh?key=${{ secrets.REFRESH_KEY }}"
